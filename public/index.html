<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Camilo Castro — Portafolio</title>
  <meta name="description" content="Portafolio de Camilo Andrés Castro Acosta, Pasto, Nariño: un iPhone 17 Pro Max desensamblado, pieza por pieza.">
  <meta name="theme-color" content="#93a8b2">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%2393a8b2%22/%3E%3Ctext x=%2232%22 y=%2241%22 font-family=%22Arial%22 font-size=%2224%22 fill=%22%23ffffff%22 text-anchor=%22middle%22%3ECC%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Instrument+Serif:ital@0;1&family=Outfit:wght@200;300;400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>try { if (localStorage.getItem('cc-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}</script>
</head>
<body class="is-loading">

  <div class="loader fixed inset-0 z-50 grid place-content-center justify-items-center gap-[22px] bg-[linear-gradient(160deg,var(--bg-1),var(--bg-2)_55%,var(--bg-3))] [transition:opacity_1s_var(--ease),visibility_1s] not-in-[.is-loading]:invisible not-in-[.is-loading]:opacity-0" aria-hidden="true">
    <div class="font-disp text-[72px] leading-none font-extralight tracking-[-.03em] text-white">CC</div>
    <div class="h-[2px] w-[200px] overflow-hidden rounded-[2px] bg-[rgba(255,255,255,.35)] dark:bg-[rgba(255,255,255,.15)]"><i class="block h-full origin-left bg-white [transform:scaleX(var(--load,0))] dark:bg-teal"></i></div>
    <div class="loader-txt font-body flex w-[200px] justify-between text-[11.5px] font-normal text-[rgba(255,255,255,.85)]"><span>Desensamblando</span><span class="loader-pct">0%</span></div>
  </div>

  <div class="pointer-events-none fixed inset-0 overflow-hidden" aria-hidden="true">
    <div class="bg-glow"></div>
    <div class="bg-word">Castro</div>
    <div class="bg-floor"></div>
  </div>

  <main class="stage" id="stage" aria-label="iPhone 17 Pro Max desensamblado. Cada componente abre una sección del portafolio."></main>
  <div class="stage ghost" id="ghost" aria-hidden="true" inert></div>

  <section class="ih" id="ih" aria-label="Presentación"></section>

  <svg class="lines" id="lines" aria-hidden="true"></svg>
  <div class="labels" id="labels"></div>
  <div class="reticle" id="reticle" aria-hidden="true"><i></i><i></i><i></i><i></i><span class="reticle-tag"></span></div>

  <header class="top pointer-events-none fixed inset-x-0 top-0 z-20 flex items-center justify-between px-7 py-[22px] *:pointer-events-auto max-[820px]:gap-[10px] max-[820px]:bg-[linear-gradient(180deg,rgba(181,197,204,.92)_50%,transparent)] max-[820px]:px-4 max-[820px]:py-[14px] dark:max-[820px]:bg-[linear-gradient(180deg,rgba(22,31,37,.94)_50%,transparent)]">
    <a class="flex items-center gap-[13px] no-underline max-[820px]:min-w-0 max-[820px]:gap-[10px]" href="#" data-home>
      <span class="brand-mark">CC</span>
      <span class="flex flex-col gap-[3px] max-[820px]:min-w-0"><strong class="font-disp text-[15px] font-medium text-ink max-[820px]:overflow-hidden max-[820px]:text-[13px] max-[820px]:text-ellipsis max-[820px]:whitespace-nowrap">Camilo Andrés Castro Acosta</strong><em class="font-body text-[12px] font-normal not-italic text-mute max-[820px]:text-[11px] max-[820px]:whitespace-nowrap">Portafolio · Pasto, Nariño</em></span>
    </a>
    <nav class="flex items-center gap-[10px] [transition:transform_1.05s_var(--ease)] max-[820px]:gap-2 min-[820px]:in-[.is-focus]:[transform:translateX(calc(-1*min(620px,46vw)-8px))] min-[820px]:in-[.is-focus]:delay-[.35s]">
      <div class="meter" id="meter"></div>
      <button class="btn-glass" id="btnAssemble">Ensamblar</button>
      <button class="btn-solid" id="btnTour">Recorrido <span>→</span></button>
      <button class="btn-theme" id="btnTheme" aria-label="Cambiar a tema oscuro" aria-pressed="false">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.6A8.3 8.3 0 0 1 9.4 4a8.3 8.3 0 1 0 10.6 10.6z"/></svg>
      </button>
    </nav>
  </header>

  <footer class="font-body pointer-events-none fixed inset-x-0 bottom-0 z-3 flex justify-between px-7 py-[22px] text-[12px] font-normal text-ink-2 [transition:opacity_.5s] in-[.is-focus]:opacity-0 max-[820px]:hidden">
    <p class="m-0 in-[.is-assembled]:opacity-0">Toca una pieza para inspeccionarla · ← → para navegar</p>
    <p class="m-0">CC-17 Pro Max · Edición 2026</p>
  </footer>

  <nav class="dock hidden max-[820px]:fixed max-[820px]:inset-x-0 max-[820px]:bottom-0 max-[820px]:z-10 max-[820px]:flex max-[820px]:gap-2 max-[820px]:overflow-x-auto max-[820px]:px-4 max-[820px]:pt-[14px] max-[820px]:pb-[calc(14px+env(safe-area-inset-bottom))] max-[820px]:[scrollbar-width:none] max-[820px]:[transition:opacity_.4s] max-[820px]:[&::-webkit-scrollbar]:hidden max-[820px]:in-[.is-assembled]:pointer-events-none max-[820px]:in-[.is-assembled]:opacity-0 max-[820px]:in-[.is-focus]:pointer-events-none max-[820px]:in-[.is-focus]:opacity-0" id="dock" aria-label="Componentes"></nav>

  <aside class="panel" id="panel" aria-hidden="true" aria-labelledby="pnTitle">
    <header class="flex flex-none items-center justify-between gap-3 border-b border-line px-[26px] py-5 max-[820px]:px-[18px] max-[820px]:py-[14px]">
      <span class="font-body text-[11.5px] font-medium tracking-[.1em] text-ac uppercase" id="pnCode"></span>
      <button class="pn-close" id="pnClose" aria-label="Cerrar y volver al teléfono">✕</button>
    </header>
    <div class="pn-scroll" id="pnScroll">
      <p class="font-body mt-0 mb-[10px] text-[12px] font-medium tracking-[.1em] text-ac uppercase" id="pnEyebrow"></p>
      <h2 class="pn-title" id="pnTitle"></h2>
      <div class="flex flex-col gap-5" id="pnBody"></div>
    </div>
    <footer class="flex flex-none items-center justify-between border-t border-line px-4 py-3">
      <button class="pn-step" id="pnPrev"><span>←</span><em></em></button>
      <span class="font-body text-[12px] font-medium tracking-[.06em] text-mute" id="pnCount"></span>
      <button class="pn-step" id="pnNext"><em></em><span>→</span></button>
    </footer>
  </aside>

  <script src="js/app.js"></script>
</body>
</html>
